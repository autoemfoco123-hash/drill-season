<script>
/* Runs before the game: works out what this browser can do.
   - Edge on Xbox: hand the controller to the game instead of the browser's cursor.
   - Browsers without import maps or modern JavaScript (the PS4 browser): load the compatibility build.
   - No WebGL (the PS4 browser turns it off for websites): the game draws with its own software renderer. */
(function () {
  var ua = navigator.userAgent || '';
  var P = window.DS_PLATFORM = {
    xbox: /Xbox/i.test(ua), xboxSeries: /Xbox Series/i.test(ua),
    ps4: /PlayStation 4/i.test(ua), ps5: /PlayStation 5/i.test(ua), nintendo: /Nintendo/i.test(ua),
  };
  P.console = P.xbox || P.ps4 || P.ps5 || P.nintendo || /PlayStation/i.test(ua);
  try { if ('gamepadInputEmulation' in navigator) navigator.gamepadInputEmulation = 'gamepad'; } catch (e) { }
  var gl = null;
  try { var c = document.createElement('canvas'); gl = c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl'); } catch (e) { }
  P.webgl = !!gl;
  P.webgl2 = !!(gl && typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext);
  var modules = 'noModule' in document.createElement('script');
  var maps = !!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
  var legacy = window.DS_LEGACY_SRC && (!maps || P.ps4 || P.ps5 || /[?&]legacy\b/.test(location.search));
  if (legacy) {
    window.__dsLegacy = true;
    document.addEventListener('DOMContentLoaded', function () { var l = document.createElement('script'); l.src = window.DS_LEGACY_SRC; document.body.appendChild(l); });
  } else if (modules && !maps) {
    var s = document.createElement('script'); s.async = true;
    s.src = 'https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js';
    document.head.appendChild(s);
  }
  var firstErr = '';
  window.addEventListener('error', function (e) { if (!firstErr) firstErr = String((e && e.message) || 'Script error'); });
  function say(title, text, detail) {
    if (window.__dsBooted || document.getElementById('ds-nogo')) return;
    var d = document.createElement('div'); d.id = 'ds-nogo';
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#07090c;color:#eef3f8;font:16px/1.5 Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-align:center');
    var b = document.createElement('div'); b.setAttribute('style', 'max-width:560px');
    var h = document.createElement('h1'); h.textContent = title; h.setAttribute('style', 'font:800 30px/1.15 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.02em;margin:0 0 14px;color:#ffb347;text-transform:uppercase');
    var p = document.createElement('p'); p.textContent = text; p.setAttribute('style', 'margin:0 0 12px;color:#c8d0d8');
    b.appendChild(h); b.appendChild(p);
    if (detail) { var q = document.createElement('p'); q.textContent = detail; q.setAttribute('style', 'margin:0;font:13px/1.4 monospace;color:#6e7a86'); b.appendChild(q); }
    d.appendChild(b); document.body.appendChild(d);
  }
  function verdict() {
    if (!modules && !legacy) say('This browser is too old', 'Drill Season needs a newer browser. Try an up-to-date Chrome, Edge, Safari or Firefox.');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', verdict); else verdict();
  // if the game never starts, explain instead of leaving a dark screen
  setTimeout(function () { if (!window.__dsBooted && ((firstErr && !legacy) || P.console)) say("The game didn't start", 'This browser could not run Drill Season. Try an up-to-date Chrome, Edge, Safari or Firefox' + (P.xbox ? ', or update Microsoft Edge on your Xbox.' : '.'), firstErr); }, legacy ? 120000 : 45000);
  // Edge on Xbox: a tip until the controller reaches the game
  if (P.xbox) document.addEventListener('DOMContentLoaded', function () {
    var t = document.createElement('div'); t.id = 'xbox-tip';
    t.textContent = 'On Xbox: if the controller moves a cursor, open the Edge menu and switch on game controller mode, then press any button.';
    t.setAttribute('style', 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9000;max-width:640px;padding:12px 18px;border-radius:12px;background:rgba(5,11,19,.86);color:#eef3f8;font:500 15px/1.4 Inter,Segoe UI,sans-serif;text-align:center;pointer-events:none');
    document.body.appendChild(t);
  });
})();
</script>
