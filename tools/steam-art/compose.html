<!doctype html>
<html><head><meta charset="utf-8">
<style>
html, body { margin: 0; overflow: hidden; background: #05060e; }
#c { position: relative; overflow: hidden; }
#c > * { position: absolute; }
.bg { transform-origin: 0 0; }
.layer { left: 0; top: 0; width: 100%; height: 100%; }
</style></head>
<body>
<div id="c"></div>
<script>
// Store art: an in-game render, graded and given falling snow, with the logo on top.
// ?kind=header|small|main|vertical|libcap|libhero|pagebg|banner
const LAYOUTS = {
  // bg: render, fx/fy: a point in the render, sx/sy: where it lands on the canvas, zoom: over "cover"
  header:   { w: 920,  h: 430,  bg: 'renders/p_side_clean.png', fx: 0.72, fy: 0.62, sx: 0.72, sy: 0.55, zoom: 1.0, logo: { x: 0.02, cy: 0.5, w: 0.46 } },
  small:    { w: 462,  h: 174,  bg: 'renders/p_side_clean.png', fx: 0.75, fy: 0.62, sx: 0.78, sy: 0.55, zoom: 1.0, logo: { x: 0.015, cy: 0.5, w: 0.6 } },
  main:     { w: 1232, h: 706,  bg: 'renders/p_side_clean.png', fx: 0.72, fy: 0.62, sx: 0.72, sy: 0.6, zoom: 1.0, logo: { x: 0.02, cy: 0.47, w: 0.47 } },
  banner:   { w: 1920, h: 1080, bg: 'renders/p_side_clean.png', fx: 0.72, fy: 0.62, sx: 0.72, sy: 0.6, zoom: 1.0, logo: { x: 0.02, cy: 0.46, w: 0.47 } },
  vertical: { w: 748,  h: 896,  bg: 'renders/p_tall.png', fx: 0.5, fy: 0.72, sx: 0.5, sy: 0.7, zoom: 1.0, logo: { x: 0.06, y: 0.025, w: 0.88 } },
  libcap:   { w: 600,  h: 900,  bg: 'renders/p_tall.png', fx: 0.5, fy: 0.7, sx: 0.5, sy: 0.7, zoom: 1.0, logo: { x: 0.05, y: 0.035, w: 0.9 } },
  libhero:  { w: 3840, h: 1240, bg: 'renders/p_wide.png', fx: 0.5, fy: 0.5, sx: 0.5, sy: 0.5, zoom: 1.0, logo: null },
  pagebg:   { w: 1438, h: 810,  bg: 'renders/p_key.png',  fx: 0.5, fy: 0.5, sx: 0.5, sy: 0.5, zoom: 1.0, logo: null, dim: true },
};
const kind = new URLSearchParams(location.search).get('kind') || 'header';
const L = LAYOUTS[kind];
const W = L.w, H = L.h;
const c = document.getElementById('c');
c.style.width = W + 'px'; c.style.height = H + 'px';
let seed = 11;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function div(style) { const d = document.createElement('div'); d.className = 'layer'; Object.assign(d.style, style); c.appendChild(d); return d; }

const img = new Image();
img.onload = () => {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const s = Math.max(W / iw, H / ih) * L.zoom;
  let left = L.sx * W - L.fx * iw * s, top = L.sy * H - L.fy * ih * s;
  left = Math.min(0, Math.max(W - iw * s, left)); top = Math.min(0, Math.max(H - ih * s, top));
  img.className = 'bg';
  Object.assign(img.style, { left: left + 'px', top: top + 'px', width: iw * s + 'px', height: ih * s + 'px',
    filter: L.dim ? 'saturate(0.9) contrast(0.95) brightness(0.55) blur(1.5px)' : 'saturate(1.3) contrast(1.1) brightness(0.97)' });
  c.appendChild(img);
  // colour: magenta in the highlights, cold blue in the shadows
  div({ background: 'linear-gradient(135deg, rgba(255,60,150,0.22), rgba(40,110,255,0.22))', mixBlendMode: 'overlay' });
  if (L.logo) {
    const lw = L.logo.w * W, lh = lw * 1265 / 2194;
    const lx = L.logo.x * W, ly = L.logo.y !== undefined ? L.logo.y * H : L.logo.cy * H - lh / 2;
    const gx = (lx + lw / 2) / W * 100, gy = (ly + lh / 2) / H * 100;
    // dark behind the logo so it reads, then a hot glow right behind it
    if (L.logo.y === undefined) div({ background: 'linear-gradient(to right, rgba(5,6,16,0.78), rgba(5,6,16,0.35) 45%, rgba(5,6,16,0) 62%)' });
    else div({ background: 'linear-gradient(to bottom, rgba(5,6,16,0.7), rgba(5,6,16,0.25) 38%, rgba(5,6,16,0) 50%)' });
    div({ background: `radial-gradient(ellipse ${lw * 0.62}px ${lh * 0.62}px at ${gx}% ${gy}%, rgba(255,120,40,0.55), rgba(255,60,120,0.18) 55%, rgba(0,0,0,0) 75%)`, mixBlendMode: 'screen' });
  }
  // the road falls into shadow at the bottom; a vignette all round
  div({ background: 'linear-gradient(to top, rgba(4,5,12,0.8), rgba(4,5,12,0) 32%)' });
  div({ background: 'radial-gradient(ellipse at 55% 45%, rgba(0,0,0,0) 55%, rgba(3,3,10,0.6) 100%)' });
  // falling snow: far flakes small and sharp, near flakes big and soft
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.className = 'layer'; c.appendChild(cv);
  const g = cv.getContext('2d');
  const k = Math.min(W, H) / 900;
  const n = Math.round(W * H / 2600);
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = rnd() * H, near = rnd() < 0.12;
    const r = (near ? 3 + rnd() * 6 : 0.8 + rnd() * 2.2) * Math.max(0.6, k);
    g.globalAlpha = near ? 0.35 + rnd() * 0.3 : 0.55 + rnd() * 0.45;
    g.filter = near ? `blur(${r * 0.6}px)` : 'none';
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  if (L.logo) {
    const lg = new Image();
    lg.onload = () => {
      const lw = L.logo.w * W, lh = lw * lg.naturalHeight / lg.naturalWidth;
      Object.assign(lg.style, { left: L.logo.x * W + 'px', top: (L.logo.y !== undefined ? L.logo.y * H : L.logo.cy * H - lh / 2) + 'px', width: lw + 'px', height: lh + 'px',
        filter: `drop-shadow(0 ${8 * k}px ${16 * k}px rgba(0,0,0,0.65))` });
      c.appendChild(lg);
      document.title = 'ready';
    };
    lg.src = 'logo_trim.png';
  } else document.title = 'ready';
};
img.src = L.bg;
</script>
</body></html>
