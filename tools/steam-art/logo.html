<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2); }
@font-face { font-family: WetPaint; src: url(node_modules/@fontsource/rubik-wet-paint/files/rubik-wet-paint-latin-400-normal.woff2); }
@font-face { font-family: Bebas; src: url(node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2); }
@font-face { font-family: Marker; src: url(node_modules/@fontsource/permanent-marker/files/permanent-marker-latin-400-normal.woff2); }
html, body { margin: 0; background: transparent; }
body.preview { background: #1d2a3a; }
#logo { display: block; }
</style></head>
<body>
<svg id="logo" xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350"></svg>
<script>
// Drill Season logo: icy chrome DRILL with snow caps and icicles, a drippy spray-paint SEASON,
// and a strip of yellow crime-scene tape behind them. Built after the fonts load so every
// letter can be measured.
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('logo');
const P = new URLSearchParams(location.search);
if (P.get('bg')) document.body.classList.add('preview');
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
// a small deterministic random, so the logo comes out the same every time
let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

document.fonts.load('600px Anton').then(() => document.fonts.load('300px WetPaint')).then(() => document.fonts.load('80px Bebas')).then(build);

function build() {
  if (P.get('icon')) return buildIcon();
  const defs = el('defs', {});
  // chrome ice: bright sky on top, a hard dark horizon line, cold light coming back up
  const g = el('linearGradient', { id: 'ice', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  [[0, '#ffffff'], [0.30, '#d8f3ff'], [0.50, '#7cc8f2'], [0.515, '#173a7a'], [0.60, '#2a5fb4'], [0.82, '#8fe0ff'], [1, '#e9fbff']]
    .forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g));
  const fire = el('linearGradient', { id: 'fire', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  [[0, '#ffe08a'], [0.35, '#ffa23a'], [0.7, '#ff5a1f'], [1, '#d81e3a']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, fire));
  const icicle = el('linearGradient', { id: 'icicle', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  [[0, '#eafaff'], [0.6, '#9fdcff'], [1, '#5fb4ff']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, icicle));
  const snow = el('linearGradient', { id: 'snow', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  [[0, '#ffffff'], [0.75, '#eef6ff'], [1, '#b9d6f2']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, snow));
  // a soft icy glow behind the letters
  const glow = el('filter', { id: 'glow', x: '-20%', y: '-40%', width: '140%', height: '180%' }, defs);
  el('feGaussianBlur', { stdDeviation: 26, result: 'b' }, glow);
  const fl = el('feFlood', { 'flood-color': '#5fd0ff', 'flood-opacity': 0.55 }, glow);
  el('feComposite', { in2: 'b', operator: 'in' }, glow);

  const cx = 1200;
  // ---------- the crime-scene tape, behind everything ----------
  const tape = el('g', { transform: `rotate(-9 ${cx} 780)` });
  // torn at both ends, so it works on any background
  const X0 = 170, X1 = 2230, Y0 = 730, Y1 = 842;
  const torn = (x, dir) => {
    let pts = [];
    const n = 7;
    for (let i = 0; i <= n; i++) pts.push([x + dir * (i % 2 ? 26 + rnd() * 18 : rnd() * 10), Y0 + (Y1 - Y0) * i / n]);
    return pts;
  };
  const left = torn(X0, -1), right = torn(X1, 1).reverse();
  const poly = [...left.reverse(), ...right].map(p => p.join(',')).join(' ');
  const clip = el('clipPath', { id: 'tapeclip' }, defs);
  el('polygon', { points: poly }, clip);
  el('polygon', { points: poly, fill: '#ffd21a', stroke: '#111', 'stroke-width': 6, 'stroke-linejoin': 'round' }, tape);
  const inner = el('g', { 'clip-path': 'url(#tapeclip)' }, tape);
  el('rect', { x: X0 - 60, y: Y0 + 8, width: X1 - X0 + 120, height: 6, fill: '#111', opacity: 0.8 }, inner);
  el('rect', { x: X0 - 60, y: Y1 - 14, width: X1 - X0 + 120, height: 6, fill: '#111', opacity: 0.8 }, inner);
  // the words land where they show: one end, the middle (peeking between the letters), the other end
  for (const [tx, anchor, txt] of [[X0 + 46, 'start', 'CALDER PARK ·'], [X1 - 46, 'end', '· CHICAGO']]) {
    const t = el('text', { x: tx, y: 814, 'text-anchor': anchor, 'font-family': 'Bebas', 'font-size': 84, fill: '#111', 'letter-spacing': 6 }, inner);
    t.textContent = txt;
  }

  // ---------- DRILL ----------
  const size = 600, base = 700, track = 40;
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = `${size}px Anton`;
  const word = 'DRILL';
  const widths = [...word].map(c => meas.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + track * (word.length - 1);
  const capH = meas.measureText('D').actualBoundingBoxAscent;
  let x = cx - total / 2;
  const letters = [];
  for (let i = 0; i < word.length; i++) {
    const m = meas.measureText(word[i]);
    letters.push({ ch: word[i], x, w: widths[i], l: x + m.actualBoundingBoxLeft * -1, r: x + m.actualBoundingBoxRight, tilt: [-4, 2, -1, 3, -3][i], dy: [0, -14, 8, -6, 10][i] });
    x += widths[i] + track;
  }
  const drill = el('g', {});
  // extrusion: a stack of copies stepping down and right, fire coloured, dark at the back
  for (let k = 26; k >= 1; k--) {
    const t = k / 26;
    // hot pink at the face fading to deep purple at the back
    const col = `rgb(${Math.round(70 + 185 * (1 - t))}, ${Math.round(12 + 40 * (1 - t))}, ${Math.round(110 + 40 * (1 - t))})`;
    for (const L of letters) {
      const tx = el('text', { x: L.x + k * 1.2, y: base + L.dy + k * 1.5, 'font-family': 'Anton', 'font-size': size, fill: k === 26 ? '#0b0620' : col,
        transform: `rotate(${L.tilt} ${L.x + L.w / 2} ${base})` }, drill);
      if (k === 26) { tx.setAttribute('stroke', '#0b0620'); tx.setAttribute('stroke-width', 26); tx.setAttribute('stroke-linejoin', 'round'); }
      tx.textContent = L.ch;
    }
  }
  // glow, then the face with a thick ink outline and a thin white edge
  for (const L of letters) {
    const tr = `rotate(${L.tilt} ${L.x + L.w / 2} ${base})`;
    const gl = el('text', { x: L.x, y: base + L.dy, 'font-family': 'Anton', 'font-size': size, fill: '#5fd0ff', filter: 'url(#glow)', transform: tr }, drill); gl.textContent = L.ch;
    const ol = el('text', { x: L.x, y: base + L.dy, 'font-family': 'Anton', 'font-size': size, fill: '#0b1020', stroke: '#0b1020', 'stroke-width': 30, 'stroke-linejoin': 'round', transform: tr }, drill); ol.textContent = L.ch;
    const wl = el('text', { x: L.x, y: base + L.dy, 'font-family': 'Anton', 'font-size': size, fill: 'url(#ice)', stroke: '#ffffff', 'stroke-width': 7, 'paint-order': 'stroke', transform: tr }, drill); wl.textContent = L.ch;
    // a few cracks and glints on the ice
    const gx = L.l + (L.r - L.l) * (0.25 + rnd() * 0.3), gy = base + L.dy - capH * (0.72 + rnd() * 0.15);
    el('path', { d: `M ${gx} ${gy - 34} L ${gx + 8} ${gy - 8} L ${gx + 34} ${gy} L ${gx + 8} ${gy + 8} L ${gx} ${gy + 34} L ${gx - 8} ${gy + 8} L ${gx - 34} ${gy} L ${gx - 8} ${gy - 8} Z`, fill: '#ffffff', opacity: 0.95, transform: tr }, drill);
    // the snow cap: a bumpy white pillow over the top of the letter, spilling past the edges
    const top = base + L.dy - capH - 6, l0 = L.l - 26, r0 = L.r + 26;
    let d = `M ${l0} ${top + 30}`;
    const bumps = 3 + Math.floor((r0 - l0) / 90);
    for (let b = 0; b < bumps; b++) {
      const x0 = l0 + (r0 - l0) * b / bumps, x1 = l0 + (r0 - l0) * (b + 1) / bumps;
      d += ` Q ${(x0 + x1) / 2} ${top - 26 - rnd() * 34} ${x1} ${top + 4 - rnd() * 10}`;
    }
    d += ` Q ${r0 + 14} ${top + 34} ${r0 - 6} ${top + 52}`;
    // the underside, with a couple of drips of snow over the face
    const drips = 2 + Math.floor(rnd() * 2);
    for (let b = drips; b >= 0; b--) {
      const xx = l0 + (r0 - l0) * (b + 0.5) / (drips + 1);
      d += ` L ${xx + 18} ${top + 46} Q ${xx} ${top + 74 + rnd() * 46} ${xx - 18} ${top + 46}`;
    }
    d += ` L ${l0 + 4} ${top + 50} Q ${l0 - 14} ${top + 40} ${l0} ${top + 30} Z`;
    el('path', { d, fill: 'url(#snow)', stroke: '#0b1020', 'stroke-width': 9, 'stroke-linejoin': 'round', transform: tr }, drill);
    // icicles off the bottom edge
    const bot = base + L.dy + 4;
    const n = 2 + Math.floor((L.r - L.l) / 70);
    for (let j = 0; j < n; j++) {
      const ix = L.l + 18 + (L.r - L.l - 36) * (j + rnd() * 0.6) / n;
      const len = 40 + rnd() * 120, w = 14 + rnd() * 14;
      el('path', { d: `M ${ix - w} ${bot} L ${ix + w} ${bot} L ${ix + 2} ${bot + len} Z`, fill: 'url(#icicle)', stroke: '#0b1020', 'stroke-width': 6, 'stroke-linejoin': 'round', transform: tr }, drill);
    }
  }

  // ---------- SEASON: drippy spray paint, tilted, over the bottom of DRILL ----------
  const sz = 300;
  const season = el('g', { transform: `rotate(-7 ${cx + 120} ${base + 250})` });
  const sx = cx + 120, sy = base + 290;
  const so = el('text', { x: sx, y: sy, 'text-anchor': 'middle', 'font-family': 'WetPaint', 'font-size': sz, fill: '#0b1020', stroke: '#0b1020', 'stroke-width': 34, 'stroke-linejoin': 'round', 'letter-spacing': 6 }, season); so.textContent = 'SEASON';
  const sh = el('text', { x: sx + 10, y: sy + 12, 'text-anchor': 'middle', 'font-family': 'WetPaint', 'font-size': sz, fill: '#0b1020', 'letter-spacing': 6 }, season); sh.textContent = 'SEASON';
  const sf = el('text', { x: sx, y: sy, 'text-anchor': 'middle', 'font-family': 'WetPaint', 'font-size': sz, fill: 'url(#fire)', stroke: '#fff3d6', 'stroke-width': 5, 'paint-order': 'stroke', 'letter-spacing': 6 }, season); sf.textContent = 'SEASON';

  // ---------- snowflakes and sparkles around it ----------
  const flakes = el('g', { fill: '#ffffff' });
  for (let i = 0; i < 26; i++) {
    const fx = 120 + rnd() * 2160, fy = 60 + rnd() * 1220, r = 4 + rnd() * 10;
    if (fx > 380 && fx < 2020 && fy > 220 && fy < 1150) continue;
    el('circle', { cx: fx, cy: fy, r, opacity: 0.55 + rnd() * 0.45 }, flakes);
  }
  for (const [px, py, s] of [[420, 260, 46], [2010, 330, 38], [1960, 1080, 30], [350, 1000, 26]]) {
    el('path', { d: `M ${px} ${py - s} L ${px + s * 0.18} ${py - s * 0.18} L ${px + s} ${py} L ${px + s * 0.18} ${py + s * 0.18} L ${px} ${py + s} L ${px - s * 0.18} ${py + s * 0.18} L ${px - s} ${py} L ${px - s * 0.18} ${py - s * 0.18} Z`, fill: '#ffffff' }, flakes);
  }
  document.title = 'ready';
}

// the square community icon: an icy D with its snow cap and icicles, a spray-paint S on top
function buildIcon() {
  svg.setAttribute('width', 1024); svg.setAttribute('height', 1024); svg.setAttribute('viewBox', '0 0 1024 1024');
  const defs = el('defs', {});
  const g = el('linearGradient', { id: 'ice', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  [[0, '#ffffff'], [0.30, '#d8f3ff'], [0.50, '#7cc8f2'], [0.515, '#173a7a'], [0.60, '#2a5fb4'], [0.82, '#8fe0ff'], [1, '#e9fbff']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g));
  const fire = el('linearGradient', { id: 'fire', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  [[0, '#ffe08a'], [0.35, '#ffa23a'], [0.7, '#ff5a1f'], [1, '#d81e3a']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, fire));
  const bg = el('radialGradient', { id: 'bg', cx: 0.5, cy: 0.4, r: 0.75 }, defs);
  [[0, '#2b3f6e'], [0.6, '#141c36'], [1, '#070a16']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, bg));
  const icicle = el('linearGradient', { id: 'icicle', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  [[0, '#eafaff'], [0.6, '#9fdcff'], [1, '#5fb4ff']].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, icicle));
  el('rect', { x: 0, y: 0, width: 1024, height: 1024, rx: 200, fill: 'url(#bg)' });
  // the tape, a short torn strip across the corner
  const tape = el('g', { transform: 'rotate(-28 512 512)' });
  el('polygon', { points: '40,690 984,690 1000,720 984,750 1000,780 40,780 24,750 40,720', fill: '#ffd21a', stroke: '#111', 'stroke-width': 6 }, tape);
  const meas = document.createElement('canvas').getContext('2d');
  const size = 720; meas.font = `${size}px Anton`;
  const m = meas.measureText('D');
  const w = m.width, capH = m.actualBoundingBoxAscent;
  const x = 470 - w / 2, base = 790;
  const l = x - m.actualBoundingBoxLeft * -1, r = x + m.actualBoundingBoxRight;
  for (let k = 22; k >= 1; k--) {
    const t = k / 22;
    const col = `rgb(${Math.round(70 + 185 * (1 - t))}, ${Math.round(12 + 40 * (1 - t))}, ${Math.round(110 + 40 * (1 - t))})`;
    const tx = el('text', { x: x + k * 1.3, y: base + k * 1.6, 'font-family': 'Anton', 'font-size': size, fill: k === 22 ? '#0b0620' : col }, svg);
    if (k === 22) { tx.setAttribute('stroke', '#0b0620'); tx.setAttribute('stroke-width', 30); tx.setAttribute('stroke-linejoin', 'round'); }
    tx.textContent = 'D';
  }
  const ol = el('text', { x, y: base, 'font-family': 'Anton', 'font-size': size, fill: '#0b1020', stroke: '#0b1020', 'stroke-width': 34, 'stroke-linejoin': 'round' }); ol.textContent = 'D';
  const fc = el('text', { x, y: base, 'font-family': 'Anton', 'font-size': size, fill: 'url(#ice)', stroke: '#fff', 'stroke-width': 8, 'paint-order': 'stroke' }); fc.textContent = 'D';
  const top = base - capH - 6, l0 = l - 30, r0 = r + 30;
  el('path', { d: `M ${l0} ${top + 34} Q ${l0 + (r0 - l0) * 0.17} ${top - 50} ${l0 + (r0 - l0) * 0.33} ${top + 4} Q ${l0 + (r0 - l0) * 0.5} ${top - 60} ${l0 + (r0 - l0) * 0.67} ${top + 2} Q ${l0 + (r0 - l0) * 0.83} ${top - 46} ${r0} ${top + 30} L ${r0 - 8} ${top + 60} L ${l0 + (r0 - l0) * 0.7 + 20} ${top + 58} Q ${l0 + (r0 - l0) * 0.7} ${top + 120} ${l0 + (r0 - l0) * 0.7 - 20} ${top + 58} L ${l0 + (r0 - l0) * 0.3 + 20} ${top + 58} Q ${l0 + (r0 - l0) * 0.3} ${top + 100} ${l0 + (r0 - l0) * 0.3 - 20} ${top + 58} L ${l0 + 6} ${top + 60} Z`,
    fill: '#fff', stroke: '#0b1020', 'stroke-width': 11, 'stroke-linejoin': 'round' });
  for (const [ix, len, wd] of [[l + 60, 110, 26], [l + 150, 70, 20], [l + 240, 130, 26], [r - 70, 90, 22]]) {
    el('path', { d: `M ${ix - wd} ${base + 4} L ${ix + wd} ${base + 4} L ${ix + 2} ${base + 4 + len} Z`, fill: 'url(#icicle)', stroke: '#0b1020', 'stroke-width': 8, 'stroke-linejoin': 'round' });
  }
  const sg = el('g', { transform: 'rotate(-8 760 800)' });
  const s1 = el('text', { x: 735, y: 935, 'text-anchor': 'middle', 'font-family': 'WetPaint', 'font-size': 540, fill: '#0b1020', stroke: '#0b1020', 'stroke-width': 46, 'stroke-linejoin': 'round' }, sg); s1.textContent = 'S';
  const s2 = el('text', { x: 735, y: 935, 'text-anchor': 'middle', 'font-family': 'WetPaint', 'font-size': 540, fill: 'url(#fire)', stroke: '#fff3d6', 'stroke-width': 6, 'paint-order': 'stroke' }, sg); s2.textContent = 'S';
  document.title = 'ready';
}
</script>
</body></html>
