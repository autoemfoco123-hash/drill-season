<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2); }
@font-face { font-family: Bebas; src: url(node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff2); }
html, body { margin: 0; background: transparent; }
#c { position: relative; width: 1920px; height: 1080px; }
.cap { position: absolute; left: 112px; bottom: 132px; transform: skewX(-6deg); }
.cap .t { font-family: Anton; font-size: 96px; line-height: 1; color: #fff; letter-spacing: 3px;
  text-shadow: 0 6px 0 rgba(10,6,32,0.9), 0 0 30px rgba(0,0,0,0.6); -webkit-text-stroke: 3px #0b1020; paint-order: stroke fill; }
.cap .bar { height: 10px; width: 46%; margin-top: 18px; background: linear-gradient(90deg, #ff9e38, #ff3d6e); box-shadow: 0 4px 0 rgba(10,6,32,0.9); }
.cap .tick { position: absolute; left: -34px; top: 10px; width: 14px; height: 86px; background: #8fe0ff; box-shadow: 0 4px 0 rgba(10,6,32,0.9); }
.end { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; font-family: Bebas; font-size: 64px; letter-spacing: 14px; color: #fff;
  text-shadow: 0 4px 0 rgba(10,6,32,0.95), 0 0 24px rgba(0,0,0,0.7); }
.end b { color: #ff9e38; font-weight: normal; }
</style></head>
<body><div id="c"></div>
<script>
const q = new URLSearchParams(location.search);
const c = document.getElementById('c');
document.fonts.load('96px Anton').then(() => document.fonts.load('64px Bebas')).then(() => {
  if (q.get('end')) {
    c.innerHTML = '<div class="end">' + q.get('end') + '</div>';
  } else {
    c.innerHTML = '<div class="cap"><div class="tick"></div><div class="t">' + q.get('t') + '</div><div class="bar"></div></div>';
  }
  document.title = 'ready';
});
</script></body></html>
